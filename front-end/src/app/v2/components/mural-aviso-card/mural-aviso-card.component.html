<div class="border-bottom py-3 text-start" [class.opacity-75]="lido">
  <h6 class="mb-1 fw-bold text-dark" [class.fw-normal]="lido">
    {{ titulo }}
    <small *ngIf="lido" class="text-muted fw-normal ms-2">(Lido)</small>
  </h6>
  <small class="text-muted d-block">Enviado por {{ remetente }} em {{ dataFormatada }} às {{ horaFormatada }}</small>
  <p class="mt-2 mb-0 small text-secondary text-break white-space">{{ conteudo }}</p>
</div>
