<editable-form [form]="form!" [disabled]="formDisabled" [title]="isModal ? '' : title" initialFocus="nome" (submit)="onSaveData()" (cancel)="onCancel()">
  <tabs display right>
    <tab key="DADOS" label="Dados do Projeto">
      <div class="row">
        <div class="row">
          <input-text [size]="12" label="Nome do Projeto Estruturante" icon="bi bi-kanban" controlName="nome" [control]="form!.controls.nome" [attr.maxlength]=250 required></input-text>
        </div>
        <div class="row">
          <input-select [size]="4" [items]="statusList" label="Status do Projeto" controlName="status" [control]="form!.controls.status"></input-select>
          <input-datetime date [size]="4" label="Início" icon="bi bi-calendar-date" controlName="data_inicio" [control]="form!.controls.data_inicio" required></input-datetime>
          <input-datetime date [size]="4" label="Término" icon="bi bi-calendar-date" controlName="data_fim" [control]="form!.controls.data_fim" required></input-datetime>
        </div>
        <div class="row">
          <input-number [size]="4" label="Progresso (%)" icon="bi bi-percent" controlName="progresso" [control]="form!.controls.progresso" [maxValue]="100" [minValue]="0"></input-number>
          <input-number [size]="4" label="Duração Estimada (Dias)" icon="bi bi-clock" controlName="duracao" [control]="form!.controls.duracao"></input-number>
          <input-number [size]="4" label="Orçamento Estimado (R$)" icon="bi bi-currency-dollar" controlName="custo" [control]="form!.controls.custo"></input-number>
        </div>
        <div class="row">
          <div class="col-md-12">
            <input-textarea [size]="12" label="Finalidade e Objetivos do Projeto" [rows]="4" controlName="finalidade" [control]="form!.controls.finalidade"></input-textarea>
          </div>
          <div class="col-md-12">
            <input-textarea [size]="12" label="Descrição Detalhada e Escopo" [rows]="4" controlName="descricao" [control]="form!.controls.descricao"></input-textarea>
          </div>
        </div>
      </div>
    </tab>
  </tabs>
</editable-form>
