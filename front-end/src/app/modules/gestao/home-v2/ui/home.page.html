<app-breadcrumb></app-breadcrumb>

<div class="container-fluid px-4 py-3">
  <!-- Saudação -->
  <h2 class="fw-semibold mb-3">{{ saudacao() }}, {{ nomeUsuario() }}</h2>

  <div class="row align-items-stretch">
    <!-- ═══ Seção: Destaques do Usuário ═══ -->
    <div class="col-lg-9 mb-4">
      <section class="home-secao h-100 d-flex flex-column justify-content-between">
        <h4 class="home-secao__titulo fw-bold mb-3">Destaques do usuário</h4>
        <div class="flex-grow-1 d-flex flex-column justify-content-center">
          <home-pendencias-usuario />
        </div>
      </section>
    </div>

    <!-- ═══ Seção: Outros destaques ═══ -->
    <div class="col-lg-3 mb-4">
      <section class="home-secao h-100 d-flex flex-column">
        <h4 class="home-secao__titulo fw-bold mb-3 text-center">Outros destaques</h4>
        <div class="row g-2 align-items-start justify-content-center my-auto">
          <div class="col-6 d-flex justify-content-center">
            <home-atalho-card icone="bi bi-speedometer2" titulo="Cockpit do Gabinete" (acao)="irParaCockpitGabinete()" />
          </div>
          <div class="col-6 d-flex justify-content-center">
            <home-atalho-card icone="bi bi-bar-chart-line" titulo="Painéis Gerenciais" (acao)="irParaPaineisGerenciais()" />
          </div>
          <div class="col-6 d-flex justify-content-center">
            <home-atalho-card icone="bi bi-kanban" titulo="Projetos Estruturantes" (acao)="irParaProjetosEstruturantes()" />
          </div>
          <div class="col-6 d-flex justify-content-center">
            <home-atalho-card icone="bi bi-diagram-3" titulo="Mapa Estratégico" (acao)="irParaPlanosEntregasVigentes()" />
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- ═══ Seção: Destaques da Unidade ═══ -->
  <section class="home-secao mb-4">
    <h4 class="home-secao__titulo fw-bold mb-3">Destaques da Unidade</h4>

    <div class="row align-items-stretch">
      <!-- Coluna única: seletor + indicadores da unidade em largura total -->
      <div class="col-12 d-flex flex-column">
        <!-- Seletor de Unidade + Toggle Subordinadas -->
        <div class="row align-items-end mb-4">
          <div class="col-md-6 col-lg-5">
            <br-select
              label="Unidade"
              [options]="unidadeOptions()"
              [value]="selectedUnidadeId()"
              (valueChange)="onUnidadeChange($event)"
              class="w-100">
            </br-select>
          </div>
          @if (exibeToggleSubordinadas()) {
            <div class="col-md-auto mb-2">
              <div class="br-switch">
                <input
                  id="subordinadas-toggle"
                  type="checkbox"
                  [checked]="subordinadas()"
                  (change)="onSubordinadasChange($any($event.target).checked)"
                />
                <label for="subordinadas-toggle">Subordinadas</label>
              </div>
            </div>
          }
        </div>

        @if (selectedUnidadeId()) {
          <!-- Row: Plano de Entregas Vigente + cards de lacuna (UE sem PE + Participante sem PT) -->
          <div class="row mb-3">
            <div class="col-md-12">
              <home-planos-vigentes class="d-block h-100" [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()"
                (planoEntregasVigenteClick)="irParaPlanosEntregasVigentes()"
                (unidadesSemPEClick)="irParaLacunasPE()"
                (participantesSemPTClick)="irParaLacunasPT()" />
            </div>
          </div>

          <!-- Unidades + Agentes Públicos + Capacidade da Equipe -->
          <div class="row mb-3">
            <div class="col-12 d-flex flex-column mb-0">
              <home-resumo-equipe class="w-100" [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
            </div>
          </div>

          <!-- Agenda de Marcos e Prazos Prioritários -->
          <div class="row">
            <div class="col-12">
              <home-agenda-marcos class="w-100 d-block" [unidadeId]="selectedUnidadeId()" [subordinadas]="subordinadas()" />
            </div>
          </div>
        }
      </div>
    </div>
  </section>
</div>
