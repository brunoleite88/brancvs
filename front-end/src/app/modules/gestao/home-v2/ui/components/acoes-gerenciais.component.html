@if (loading()) {
  <div class="d-flex justify-content-center align-items-center h-100">
    <span class="br-loading small" role="progressbar"></span>
  </div>
} @else {
  <div class="d-flex justify-content-around align-items-start h-100 gap-3">
    <home-atalho-card icone="bi bi-file-earmark-person" titulo="Meu Relatório Mensal de Atividades" (acao)="irParaMeuRelatorio()" />
    <home-atalho-card icone="bi bi-speedometer2" titulo="Painel da Corregedoria" (acao)="irParaPainelCorregedoria()" />
  </div>
}
