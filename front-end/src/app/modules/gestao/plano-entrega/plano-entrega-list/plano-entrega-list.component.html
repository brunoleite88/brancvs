<grid [dao]="dao" [add]="add" [title]="isModal ? '' : title" [orderBy]="orderBy" [groupBy]="groupBy" [join]="join"
    [selectable]="selectable" (select)="onSelect($event)" [hasAdd]="canAdd()"
    [scrollable]="true" [maxHeight]="650" [className]="'plano-entrega'"
    [hasEdit]="false" [loadList]="onGridLoad.bind(this)">
    <toolbar *ngIf="!selectable" [buttons]="toolbarButtons">
        <input-switch [size]="4"
                      labelPosition="left"
                      label="Unidades Subordinadas"
                      (change)="disableMeus()"
                      labelInfo="Planos de ação setoriais das unidades subordinadas"
                      [control]="filter!.controls.subordinadas"
        >
        </input-switch>
        <input-switch *ngIf="!avaliacao" [size]="2" labelPosition="left" label="Vinculados" controlName="principais" [control]="filter!.controls.principais" (change)="onPrincipaisChange($event)" [labelInfo]="lex.translate('Unidades') + ' onde o ' + lex.translate('usuario') + ' é integrante, incluindo unidades superiores sob sua gerência.'"></input-switch>
    </toolbar>
    <filter [deleted]="this.auth.hasPermissionTo('MOD_AUDIT_DEL')" [form]="filter" [where]="filterWhere" [submit]="filterSubmit.bind(this)" [clear]="filterClear.bind(this)" [collapseChange]="filterCollapseChange.bind(this)" [collapsed]="!selectable && filterCollapsed" [visible]="showFilter">
        <div *ngIf="isModal else naoEModal">
            <div class="row">
                <input-switch [size]="1"
                              label="Meus"
                              (change)="disableSub()"
                              [control]="filter!.controls.meus_planos"
                              labelInfo="Planos de ação setoriais das unidades da qual sou integrante (Áreas de trabalho)"
                >
                </input-switch>
                <input-search #unidade [size]="5" [control]="filter!.controls.unidade_id" controlName="unidade_id" [dao]="unidadeDao"></input-search>
                <input-select [size]="2" label="Data" itemTodos="- Nenhum -" [valueTodos]="null" controlName="data_filtro" [control]="filter!.controls.data_filtro" [items]="DATAS_FILTRO"></input-select>
                <input-datetime [size]="2" date [disabled]="filter!.controls.data_filtro.value == null ? 'true' : undefined" label="Início" controlName="data_filtro_inicio" [control]="filter!.controls.data_filtro_inicio" labelInfo="Data início do período"></input-datetime>
                <input-datetime [size]="2" date [disabled]="filter!.controls.data_filtro.value == null ? 'true' : undefined" label="Fim" controlName="data_filtro_fim" [control]="filter!.controls.data_filtro_fim" labelInfo="Data fim do período"></input-datetime>
            </div>
        </div>
        <ng-template #naoEModal>
            <div class="row">
                <input-switch [size]="1" label="Meus"
                              [control]="filter!.controls.meus_planos"
                              (change)="disableSub()"
                              labelInfo="Planos de ação setoriais das unidades da qual sou integrante (Áreas de trabalho)">
                </input-switch>
                <input-text [size]="3" label="Nome" controlName="nome" [control]="filter!.controls.nome" [placeholder]="'Nome do plano de ação setorial'" [attr.maxlength]=250></input-text>
                <input-search #unidade [size]="4" [control]="filter!.controls.unidade_id" controlName="unidade_id" [dao]="unidadeDao"></input-search>
                <input-select [size]="3" label="Status" controlName="status" [control]="filter!.controls.status" [items]="lookup.PLANO_ENTREGA_STATUS" [filter]="avaliacao ? ['CONCLUIDO', 'AVALIADO'] : undefined" itemTodos="- Todos -" [valueTodos]="'TODOS'"></input-select>
                <input-switch [size]="1" label="Arquivados" controlName="arquivadas" [control]="filter!.controls.arquivadas" labelInfo="Listar também os planos de ação setoriais arquivados"></input-switch>
            </div>
            <div class="row">
                <input-search #planejamento [size]="6" [control]="filter!.controls.planejamento_id" controlName="planejamento_id" [dao]="planejamentoDao"></input-search>
                <input-select [size]="2" label="Data" itemTodos="- Nenhum -" [valueTodos]="null" controlName="data_filtro" [control]="filter!.controls.data_filtro" [items]="DATAS_FILTRO"></input-select>
                <input-datetime [size]="2" date [disabled]="filter!.controls.data_filtro.value == null ? 'true' : undefined" label="Início" controlName="data_filtro_inicio" [control]="filter!.controls.data_filtro_inicio" labelInfo="Data início do período"></input-datetime>
                <input-datetime [size]="2" date [disabled]="filter!.controls.data_filtro.value == null ? 'true' : undefined" label="Fim" controlName="data_filtro_fim" [control]="filter!.controls.data_filtro_fim" labelInfo="Data fim do período"></input-datetime>
            </div>
        </ng-template>
    </filter>
    <columns>
        <column *ngIf="!selectable" type="expand" icon="bi bi-list-check" [align]="'center'" verticalAlign="middle" cellClass="align-middle" [hint]="lex.translate('Entrega')" [width]="55" [template]="columnEntregas" [expandTemplate]="columnExpandedEntregas">
            <ng-template let-row="row" #columnEntregas>
                <span *ngIf="row.entregas?.length" class="fw-bold text-secondary">{{row.entregas?.length}}</span>
            </ng-template>
            <ng-template let-row="row" #columnExpandedEntregas>
                <plano-entrega-list-entrega [parent]="this" [disabled]="avaliacao || !botaoAtendeCondicoes(BOTAO_ALTERAR, row)" [entity]="row" [execucao]="execucao" [cdRef]="cdRef" [planejamentoId]="row.planejamento_id" [cadeiaValorId]="row.cadeia_valor_id" [unidadeId]="row.unidade_id"></plano-entrega-list-entrega>
            </ng-template>
        </column>
        <column title="#ID" orderBy="numero" [align]="'center'" verticalAlign="middle" cellClass="align-middle" [template]="columnNumero" [width]="75">
            <ng-template let-row="row" #columnNumero>
                <span class="fw-semibold text-secondary">#{{row.numero}}</span>
            </ng-template>
        </column>
        <column [title]="'Nome' + (!filter!.controls.agrupar.value ? ' - Unidade' : '')" orderBy="nome" verticalAlign="middle" cellClass="align-middle" [template]="columnNome" [minWidth]="260" [maxWidth]="440">
            <ng-template let-row="row" #columnNome>
                <div class="fw-bold text-dark text-break text-wrap">{{row.nome || ""}}</div>
                <div class="text-secondary text-wrap mt-1" *ngIf="!filter!.controls.agrupar.value && row.unidade">
                    <span class="fw-semibold text-secondary">{{row.unidade.sigla}}</span>
                </div>
            </ng-template>
        </column>
        <column title="Início" [align]="'center'" verticalAlign="middle" cellClass="align-middle" [template]="columnInicio" orderBy="data_inicio" [width]="115">
            <ng-template let-row="row" #columnInicio>
                <span class="text-dark fw-semibold">{{dao!.getDateFormatted(row.data_inicio)}}</span>
            </ng-template>
        </column>
        <column title="Fim" [align]="'center'" verticalAlign="middle" cellClass="align-middle" [template]="columnFim" orderBy="data_fim" [width]="115">
            <ng-template let-row="row" #columnFim>
                <span class="text-secondary fw-semibold">{{dao!.getDateFormatted(row.data_fim)}}</span>
            </ng-template>
        </column>
        <column title="Planejamento Institucional" verticalAlign="middle" cellClass="align-middle" [template]="columnPlanoCadeia" [minWidth]="220" [maxWidth]="340">
            <ng-template let-row="row" #columnPlanoCadeia>
                <div *ngIf="row.planejamento" class="text-dark fw-semibold text-wrap">{{row.planejamento?.nome}}</div>
                <span *ngIf="!row.planejamento" class="text-muted">—</span>
            </ng-template>
        </column>
        <column [title]="'Status\nAvaliação'" [align]="'center'" verticalAlign="middle" cellClass="align-middle" [template]="columnStatus" [width]="140" [minWidth]="135">
            <ng-template let-row="row" #columnStatus>
                <div class="fw-bold text-dark">{{statusLabel(row)}}</div>
                <div *ngIf="row.data_arquivamento" class="text-secondary">Arquivado</div>
                <div *ngIf="row.deleted_at" class="text-danger">Excluído</div>
                <avaliar-nota-badge *ngIf="row.avaliacao" [align]="'center'" [tipoAvaliacao]="row.avaliacao.tipo_avaliacao" [nota]="row.avaliacao.nota"></avaliar-nota-badge>
            </ng-template>
        </column>
        <column type="options" verticalAlign="middle" cellClass="align-middle" [width]="95" [minWidth]="95" [dynamicOptions]="dynamicOptions.bind(this)" [dynamicButtons]="dynamicButtons.bind(this)"></column>
    </columns>
    <pagination
        [rows]="rowsLimit"
        [infiniteScrollContainer]="'.plano-entrega-table'"
        [fromRoot]="true"
    ></pagination>
</grid>
