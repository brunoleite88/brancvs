<div *ngIf="carregando" class="d-flex justify-content-center py-4">
    <div class="spinner-border" role="status">
        <span class="visually-hidden"></span>
    </div>
</div>
<div [class.d-none]="carregando">
    <toolbar [buttons]="toolbarButtons"></toolbar>
    <editable-form [form]="form!" [noButtons]="isPanel ? 'true' : undefined" (submit)="onSaveData()" (cancel)="onCancel()">
        <div class="row">
            <div *ngIf="!etiquetas" class="col-md-6">
                <separator transparent title="Tema e Aparência">
                    <div class="row">
                        <input-select [size]="12" label="Tema da Interface" icon="bi bi-palette" controlName="theme" [control]="form!.controls.theme" [items]="lookup.THEMES" (change)="onThemeChange($event)"></input-select>
                    </div>
                </separator>
            </div>
            <div *ngIf="etiquetas" class="col-md-12">
                <input-multiselect label="Etiquetas" multiselectStyle="inline" controlName="etiquetas" [size]="12" [addItemHandle]="addItemHandleEtiquetas.bind(this)">
                    <input-text [size]="5" label="Texto" controlName="etiqueta_texto" [attr.maxlength]=250></input-text>
                    <input-select [size]="3" label="Ícone" icon="fas fa-sign-out-alt" controlName="etiqueta_icone" liveSearch [items]="lookup.ICONES"></input-select>
                    <input-color [size]="4" label="Cor" controlName="etiqueta_cor"></input-color>
                </input-multiselect>
            </div>
        </div>
        <separator *ngIf="entity && !etiquetas" transparent title="Notificações e Alertas">
            <notificacoes-config #notificacoes [entity]="entity!" [disabled]="formDisabled"></notificacoes-config>
        </separator>
    </editable-form>
</div>
